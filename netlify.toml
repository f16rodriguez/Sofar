[build]
  command = "npm run build"
  # The Next.js runtime refuses a publish directory equal to the site's base
  # directory, which is what an unset publish resolves to — every upload
  # deploy failed on exactly that, after a successful `next build`.
  publish = ".next"

[build.environment]
  # Next.js inlines NEXT_PUBLIC_* values into the client bundle by design, and
  # Netlify's secret scanner then finds them in build output and fails the
  # build. Both of these are meant to be public: the anon key is safe because
  # RLS stands behind it. Every genuine secret — service role, Anthropic,
  # Deepgram — is server-only and stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
  # Match the version the app is developed and typechecked against.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Standalone functions (netlify/functions): the daily jobs, the daily
# question, and the PDF export — the last one deliberately outside the Next
# handler, see lib/export/book-pdf.tsx.
[functions]
  node_bundler = "esbuild"

[functions."export-pdf"]
  included_files = ["assets/fonts/*"]
  # react-pdf's pdfkit resolves its standard fonts and colour profile through
  # its own package.json (imports, import.meta.url), which a flat bundle
  # breaks. Shipped as real node_modules inside the function instead.
  external_node_modules = ["@react-pdf/renderer"]
